media:
  - name: member-images
    label: Member photos
    input: images/members
    output: /images/members
    categories: [image]
  - name: project-images
    label: Project images
    input: images/projects
    output: /images/projects
    categories: [image]
  - name: site-images
    label: Site images
    input: images
    output: /images
    categories: [image]
  - name: insight-images
    label: Insight images
    input: images/insights
    output: /images/insights
    categories: [image]

content:
  - name: team
    label: Team members
    type: file
    path: _data/team.yml
    format: yaml
    list: true
    view:
      primary: name
      sort: order
      order: asc
    fields:
      - name: name
        type: string
        label: Name
      - name: title
        type: string
        label: Title / Position
      - name: summary
        type: rich-text
        label: Bio
      - name: picture
        type: image
        label: Photo
        options:
          media: member-images
      - name: order
        type: number
        label: Display order

  - name: projects
    label: Projects
    type: file
    path: _data/projects.yml
    format: yaml
    list: true
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        type: string
        label: Project title
      - name: description
        type: rich-text
        label: Description
      - name: picture
        type: image
        label: Cover image
        options:
          media: project-images
      - name: order
        type: number
        label: Display order

  - name: insights
    label: Insights
    type: collection
    path: _insights
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        type: string
        label: Title
      - name: date
        type: datetime
        label: Publication date
      - name: description
        type: text
        label: Summary
      - name: picture
        type: image
        label: Cover image
        options:
          media: insight-images
      - name: author
        type: string
        label: Author
      - name: body
        type: rich-text
        label: Content

  - name: site
    label: Site settings
    type: file
    path: _config.yml
    format: yaml
    fields:
      - name: title
        type: string
        label: Site title
      - name: description
        type: text
        label: Site description
      - name: url
        type: string
        label: Site URL
      - name: email
        type: string
        label: Contact email
      - name: address
        type: string
        label: Company address
      - name: vat
        type: string
        label: VAT number
      - name: year
        type: string
        label: Copyright year
