<div class="bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition-all duration-300">
  <div class="flex-shrink-0 h-10 w-10 bg-brand rounded-full flex items-center justify-center mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="{{ include.icon }}"/>
    </svg>
  </div>
  <h3 class="text-xl font-bold text-gray-800 mb-2">{{ include.title }}</h3>
  <p class="text-gray-600 mb-3">{{ include.description }}</p>
  {% if include.items %}
  <ul class="space-y-1.5">
    {% for item in include.items %}
    <li class="flex items-center gap-1 text-gray-600">
      <svg class="h-4 w-4 text-brand flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      {{ item }}
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
