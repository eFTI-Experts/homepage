<a href="{{ include.url }}" class="flex flex-col gap-2 p-4 hover:shadow-lg rounded-lg transition-shadow h-full w-full">
  {% if include.picture %}
    <img class="border rounded-md w-full h-48 object-cover" src="{{ include.picture }}" alt="{{ include.title }}" loading="lazy">
  {% endif %}
  <h3 class="text-2xl text-brand font-bold">{{ include.title }}</h3>
  <div class="text-sm text-gray-500">
    <time datetime="{{ include.date | date: '%Y-%m-%d' }}">{{ include.date | date: "%B %-d, %Y" }}</time>
  </div>
  <p class="font-thin text-gray-600 line-clamp-3">{{ include.description }}</p>
</a>
