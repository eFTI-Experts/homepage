<footer class="bg-white border-t border-gray-200 py-6 px-4">
  <div class="max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-center gap-6">
      <div class="flex items-center gap-4">
        <img src="/images/logo.png" width="100" height="50" alt="eFTI Experts" loading="lazy">
        <div class="flex flex-col text-gray-600 text-sm">
          <span>VAT: {{ site.vat }}</span>
          <span>{{ site.address }}</span>
          <span>{% if site.year != "" and site.year %}{{ site.year }}{% else %}{{ 'now' | date: "%Y" }}{% endif %} eFTI Experts OÜ.</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <a href="/imprint/" class="hover:text-brand transition-colors">Imprint</a>
        <a class="transition-transform hover:scale-110" href="mailto:team@eftiexperts.eu" title="Email us">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-black">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </a>
        <a class="transition-transform hover:scale-110" href="https://www.linkedin.com/company/efti-experts/" target="_blank" rel="noopener noreferrer" title="Follow us on LinkedIn">
          <img src="/images/linkedin.svg" width="32" height="32" alt="LinkedIn">
        </a>
      </div>
    </div>
  </div>
  <div class="max-w-6xl mx-auto mt-8 pt-8 border-t text-center text-sm">
    <button id="cookie-settings-link" class="underline hover:text-brand text-gray-600">Cookie Settings</button>
  </div>
</footer>
