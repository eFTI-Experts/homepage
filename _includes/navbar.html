<nav class="bg-white w-full sticky top-0 z-20 shadow-sm">
  <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
    <a href="/">
      <img src="/images/logo.png" width="120" height="40" alt="eFTI Experts" loading="eager">
    </a>

    <div class="hidden md:flex items-center gap-4">
      {% for item in site.data.nav %}
        <a href="{{ item.url }}" class="cursor-pointer hover:text-brand py-2 px-4 transition-colors">{{ item.title }}</a>
      {% endfor %}
    </div>

    <div class="md:hidden flex items-center">
      <button type="button" id="mobile-menu-button" class="p-2 rounded-md text-gray-600 hover:text-gray-900">
        <img src="/images/menu-icon.svg" alt="Menu" width="24" height="24">
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="md:hidden hidden">
    <hr class="mx-2 border-gray-200">
    <div class="flex flex-col items-center px-2 pt-2 pb-3 gap-3">
      {% for item in site.data.nav %}
        <a href="{{ item.url }}" class="hover:bg-gray-100 w-full text-xl py-1 text-center hover:cursor-pointer hover:underline">{{ item.title }}</a>
      {% endfor %}
    </div>
  </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('mobile-menu-button');
    var menu = document.getElementById('mobile-menu');
    btn.addEventListener('click', function() {
      menu.classList.toggle('hidden');
    });
  });
</script>
