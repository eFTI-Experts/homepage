- title: eFTI4ALL project
  description: >-
    The **eFTI4ALL** project, co-funded by the European Commission under the
    Connecting Europe Facility (CEF) programme, aims to accelerate the adoption
    and interoperability of the **eFTI Regulation** across EU Member States and
    the logistics community.  

    Running until 2028 with a budget of €30 million, it brings together 33
    partners from six Member States.  

    The project complements the **eFTI4EU** initiative by supporting the broader
    implementation of digital logistics solutions and promoting the adoption of
    **eFTI Platforms** across Europe.

    <br/>

    <br/>

    ++**Role of eFTI Experts Team (EET)**++<br/>

    The **eFTI Experts Team (EET)**, consisting of the founders of **eFTI
    Experts** company and additional experts Rudy Hemeleers, Marco Gorini,
    Alexio Picco, and Christian Lüpges, plays a critical role in ensuring the
    successful implementation of the project's technical and communication
    goals.  

    The team is responsible for harmonising the development of the interoperable
    eFTI Exchange Environment, aligning with the **eFTI Regulation** and
    initiatives like the **Digital Transport and Logistics Forum (DTLF)**.  

    Working closely with the Project Coordination Committee, the EET ensures
    that the project's activities are executed on time, with technical
    correctness and cross-fertilisation of ideas between work packages and field
    operational tests.  

    Additionally, the team leads the development and submission of key
    deliverables to the European Commission, while supporting the dissemination
    of project results and fostering stakeholder engagement throughout Europe.  

    <br/>

    **EEC, as part of the extended eFTI Experts Team, plays a central role in
    the day-to-day coordination of the eFTI4LIVE project and provides technical
    expertise and consultation to the consortium.**
  picture: /images/projects/Blue_Logo_eFTI4ALL.png
  order: 1
- title: Technical assistance to DG MOVE
  description: Together with Circle S.p.A., eFTI Experts provided technical
    assistance to the European Commission’s Directorate-General for Mobility and
    Transport (DG MOVE) to support the implementation of Regulation (EU)
    2020/1056 on electronic freight transport information (eFTI). The
    consultancy focused on facilitating the development and implementation of
    common procedures and detailed rules for competent authorities to access and
    process electronic freight transport information. As a result, technical
    guidance document for authorities (TGD1) was introduced and later on
    published in eFTI WIKI.
  picture: /images/projects/dgmove.png
- title: eFTI4LIVE project
  description: The eFTI4LIVE project is an initiative co-funded by the European
    Union’s Connecting Europe Facility (CEF) Programme under Grant Agreement
    101233034, bringing together 55 partners across 19 EU Member States. The
    project builds on the ongoing eFTI4EU and eFTI4ALL projects to implement the
    Electronic Freight Transport Information (eFTI) system by 2027. It aims to
    streamline data exchange and ensure compliance with the eFTI Regulation (EU
    2020/1056), improving efficiency and sustainability in the freight sector.
    Change the trademark on the bottom of the page to 2026 or remove the year if
    possible. **EEC, as part of the extended eFTI Experts Team, plays a central
    role in the day-to-day coordination of the eFTI4LIVE project and provides
    technical expertise and consultation to the consortium.**
  picture: /images/projects/efti4live.png
