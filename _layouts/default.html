<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', { 'analytics_storage': 'denied' });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="keywords" content="eFTI, experts, digital, solutions, consulting, growth, innovation, regulatory, compliance, freight, digilogistics, center">
  <meta name="author" content="eFTI Experts OÜ">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ site.url }}/images/og-image.png">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="en_GB">

  <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="shortcut icon" href="/images/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="eFTI Experts">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tailwind.min.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "eFTI Experts OÜ",
    "description": "eFTI Experts OÜ is an Estonian consultancy company focusing on eFTI related projects, supporting sustainable digital logistics, and offering RegTech services across Northern and Central Europe.",
    "url": "{{ site.url }}",
    "logo": "{{ site.url }}/images/logo.png",
    "sameAs": ["https://www.linkedin.com/company/efti-experts/"],
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Laeva 2",
      "addressLocality": "Tallinn",
      "addressCountry": "Estonia"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "Customer Service",
      "email": "{{ site.email }}",
      "areaServed": "EU"
    },
    "foundingDate": "2023",
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Consultancy Services",
      "itemListElement": [
        {% for service in site.data.services %}
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": {{ service.title | jsonify }},
            "description": {{ service.description | jsonify }}
          }
        }{% unless forloop.last %}, {% endunless %}
        {% endfor %}
      ]
    }
  }
  </script>

  {{ page.extra_head }}
</head>
<body class="font-sans text-gray-900 bg-white">
  {% include navbar.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  {% include cookie-banner.html %}

  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css">
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>AOS.init();</script>

  <script>
    (function() {
      var GA_ID = 'G-480CVMK8YL';
      var consent = localStorage.getItem('cookie_consent');
      var banner = document.getElementById('cookie-banner');

      function loadGA() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        gtag('consent', 'update', { 'analytics_storage': 'granted' });
        gtag('js', new Date());
        gtag('config', GA_ID);
      }

      function showBanner() { banner.classList.remove('hidden'); }

      if (consent === 'accepted') { loadGA(); }
      else if (!consent) { showBanner(); }

      document.getElementById('cookie-accept').addEventListener('click', function() {
        localStorage.setItem('cookie_consent', 'accepted');
        banner.classList.add('hidden');
        loadGA();
      });

      document.getElementById('cookie-decline').addEventListener('click', function() {
        localStorage.setItem('cookie_consent', 'declined');
        banner.classList.add('hidden');
      });

      var settingsLink = document.getElementById('cookie-settings-link');
      if (settingsLink) {
        settingsLink.addEventListener('click', function(e) {
          e.preventDefault();
          showBanner();
        });
      }
    })();
  </script>
</body>
</html>
