---
layout: default
---
<article class="py-16 px-4">
  <div class="max-w-4xl mx-auto">
    <a href="/insights/" class="inline-flex items-center gap-2 text-brand hover:underline mb-8 text-lg">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
      </svg>
      Back to Insights
    </a>

    {% if page.picture %}
      <img src="{{ page.picture }}" alt="{{ page.title }}" class="w-full h-64 md:h-96 object-cover rounded-2xl mb-8">
    {% endif %}

    <h1 class="text-4xl md:text-5xl font-bold mb-4">{{ page.title }}</h1>

    <div class="flex items-center gap-4 text-gray-500 mb-8">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
      {% if page.author %}
        <span>&middot;</span>
        <span>{{ page.author }}</span>
      {% endif %}
    </div>

    <div class="prose max-w-none">
      {{ content }}
    </div>
  </div>
</article>
